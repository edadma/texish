name: Release binaries

# Builds the native texish CLI and attaches it to a GitHub release. Runs
# automatically when a release is published, and can be dispatched manually
# against an existing tag (e.g. to add binaries to a release made by hand).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach binaries to (e.g. v0.10.0)'
        required: true

# gh release upload needs write access to releases.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build Linux on 22.04 (glibc 2.35) so the binaries also run on older
          # distros; newer glibc is not backward-compatible, older is forward-compatible.
          - { runner: ubuntu-22.04,     os: linux, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64  }
          # Pin to an explicit macOS image (not macos-latest) so the binary's
          # deployment-target floor stays low and predictable instead of drifting
          # up whenever GitHub moves the rolling label to a newer macOS.
          # macOS Intel (macos-13) is omitted: that runner pool is so scarce the job
          # would sit unassigned for the whole run, leaving the action stuck "queued"
          # and never attaching the other binaries. Intel Macs fall back to the JVM build.
          - { runner: macos-14,         os: macos, arch: arm64  }
    steps:
      - name: Checkout texish
        uses: actions/checkout@v7

      # Scala Native links through the host's C/C++ toolchain, and the CLI binds
      # cairo, freetype and turbojpeg, so those system libraries must be present
      # at link time. macOS runners already have clang + these libs; Linux needs
      # them installed.
      - name: Install native toolchain (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libcairo2-dev libfreetype-dev cmake

      # The turbojpeg binding uses the TurboJPEG 3 API (tj3*), which only exists
      # in libjpeg-turbo 3.x. Ubuntu's apt package is still 2.x, so build 3.x from
      # source and install it into the default prefix where -lturbojpeg finds it.
      - name: Build libjpeg-turbo 3.x (Linux)
        if: matrix.os == 'linux'
        run: |
          git clone --depth 1 --branch 3.0.4 https://github.com/libjpeg-turbo/libjpeg-turbo.git
          cmake -S libjpeg-turbo -B libjpeg-turbo/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DWITH_SIMD=0
          cmake --build libjpeg-turbo/build -j
          sudo cmake --install libjpeg-turbo/build
          sudo ldconfig

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-${{ runner.arch }}-sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sbt-

      - name: Build native CLI (release-fast)
        run: sbt 'set ThisBuild / nativeConfig ~= { _.withMode(scala.scalanative.build.Mode.releaseFast) }' texishCli/nativeLink

      # Asset name drops the leading "v" so it matches the artifact version
      # (texish-0.10.0-linux-x86_64, not texish-v0.10.0-...).
      - name: Resolve version
        id: ver
        run: |
          TAG='${{ github.event.release.tag_name || inputs.tag }}'
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Stage binary
        run: cp cli/target/scala-*/texish-cli "texish-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.ver.outputs.tag }}" "texish-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}" --clobber
