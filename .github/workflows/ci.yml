name: CI

on:
  push:
    branches: [dev, stable]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-${{ runner.arch }}-sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sbt-

      - run: sbt texishJVM/test

  # Renders every demo in scripts/ with the real binary, from an empty working directory, in the two
  # configurations a user can actually be in. Unit tests cannot see this class of defect: they run
  # from the checkout, where the font tree and the packages are always found whether or not an
  # installation would have found them. Three defects shipped that way in one cycle.
  render:
    name: render corpus
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # These four steps mirror the build job in release-binaries.yml, deliberately duplicated
      # rather than factored into a composite action: that workflow is load-bearing at release time
      # and a refactor of it cannot be tested anywhere but in a release. Keep the two in step — in
      # particular the libjpeg-turbo version, since the binding needs the TurboJPEG 3 API.
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libcairo2-dev libfreetype-dev cmake

      - name: Build libjpeg-turbo 3.x
        run: |
          git clone --depth 1 --branch 3.0.4 https://github.com/libjpeg-turbo/libjpeg-turbo.git
          cmake -S libjpeg-turbo -B libjpeg-turbo/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DWITH_SIMD=0
          cmake --build libjpeg-turbo/build -j
          sudo cmake --install libjpeg-turbo/build
          sudo ldconfig

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-${{ runner.arch }}-sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sbt-

      # Debug mode: this job is about what the binary can find, not how fast it runs, and
      # release-fast linking costs several minutes for nothing here.
      - name: Build the native CLI
        run: sbt texishCli/nativeLink

      # Two installations, built the way a user's would be. The bare one has nothing above it to
      # find — /tmp holds no fonts/ or packages/ — so it exercises the compiled-in core alone. The
      # prefix one is laid out exactly as the share tarball unpacks, and is reached without
      # $TEXISHHOME, so it exercises self-location too.
      - name: Install two ways
        run: |
          mkdir -p /tmp/bare/bin /tmp/prefix/bin /tmp/prefix/share/texish
          cp cli/target/scala-*/texish-cli /tmp/bare/bin/texish
          cp cli/target/scala-*/texish-cli /tmp/prefix/bin/texish
          cp -R fonts packages /tmp/prefix/share/texish/

      - name: Render with no installation
        run: tools/render-corpus.sh /tmp/bare/bin/texish

      - name: Render against a full installation
        run: tools/render-corpus.sh /tmp/prefix/bin/texish --all
