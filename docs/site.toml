# texish documentation site — built with juicer, juicerdocs theme.
#
# Local preview:  cd /Users/ed/dev/juicer && sbt 'juicerJVM/run serve -s /Users/ed/dev/texish/docs -L'
# Build:          cd /Users/ed/dev/juicer && sbt 'juicerJVM/run build --source /Users/ed/dev/texish/docs'

title       = "texish"
author      = "Ed Maxedon"
baseURL     = "https://texish.edadma.dev/"
description = "A TeX-style document layout and rendering engine for Scala (JVM, Native, JS)."

# Drives the topbar GitHub icon and the homepage hero "Star on GitHub" button.
repoURL = "https://github.com/edadma/texish"

theme = "juicerdocs"

# The page <h1> comes from frontmatter title — markdown headings start at h2.
headingShift = 0

# Static hosts serve the on-disk layout literally, so the URL space must match
# the file tree. The standard baseline ships htmlDir = "html", which strips a
# segment from URLs but not from paths and breaks deploys. Force it off.
htmlDir = ""

# Recompile the theme CSS from SCSS and bundle/minify the theme JS on every
# build (fingerprinted for cache-busting). When sass/esbuild aren't on PATH the
# pipeline degrades to a verbatim copy of the source, so the page still renders.
[assets]
enabled     = true
fingerprint = true

[[assets.sass]]
input  = "themes/juicerdocs/src/scss/juicerdocs.scss"
output = "/juicerdocs.css"
minify = true

[[assets.esbuild]]
input  = "themes/juicerdocs/static/juicerdocs.js"
output = "/juicerdocs.js"
minify = true

[juicerdocs]
version    = "v0.19.8"
getStarted = true

# Indigo palette. Light mode.
brand           = "#4263eb"        # indigo-6 — links, button fills, hero gradient start
brandStrong     = "#3b5bdb"        # indigo-7 — hover state
brandSoft       = "#dbe4ff"        # indigo-1 — soft tint: sidebar hover, badges
accent          = "#5c7cfa"        # indigo-5 — hero gradient end, decorative highlights

# Dark-mode overrides (lighter, as dark surfaces need more luminance).
brandDark       = "#91a7ff"        # indigo-3
brandStrongDark = "#bac8ff"        # indigo-2
brandSoftDark   = "rgb(66 99 235 / .14)"
accentDark      = "#748ffc"        # indigo-4
